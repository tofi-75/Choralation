[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
cache_dir = "../.cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "common", "config", "hymns"]

[tool.ruff.format]
quote-style = "double"
