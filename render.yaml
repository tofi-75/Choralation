# Secrets are entered by the owner in Render, never committed here.
services:
  - type: web
    name: choralation
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # GitHub production operations takes and verifies DB + PDF backups first.
    autoDeployTrigger: 'off'
    healthCheckPath: /health/ready/
    envVars:
      # Render generateValue produces 44 chars; Django requires at least 50.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_STORAGE_BACKEND
        value: s3
      - key: DJANGO_TRUST_PROXY_HTTPS
        value: "true"
      - key: RUN_STARTUP_MIGRATIONS
        value: "true"
      # Enable only after the attended bootstrap and restore rehearsal.
      - key: PRODUCTION_OPERATIONS_ENABLED
        sync: false
      - key: OPERATIONS_DATABASE_URL
        sync: false
      - key: DEPLOY_CHECK_TOKEN
        sync: false
      - key: PDF_COMPRESSED_WRITES
        value: "false"
      - key: APP_TIME_ZONE
        value: Asia/Beirut
      - key: ALLOW_HOSTED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        value: sheet-music
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
