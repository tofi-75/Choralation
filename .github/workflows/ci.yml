name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  DJANGO_SECRET_KEY: ci-only-secret-not-used-outside-the-run-0000000000000000000000
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  MARONITE_FEED_ENABLED: "false"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: choralation_ci
          POSTGRES_USER: choralation
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U choralation -d choralation_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://choralation:ci-only-password@127.0.0.1:5432/choralation_ci
      TEST_DATABASE_NAME: test_choralation_ci
      DJANGO_MEDIA_ROOT: ${{ github.workspace }}/.cache/ci-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: python -m pip check
      - name: Backend checks (fresh PostgreSQL, real migrations and hashing)
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m ruff check --config pyproject.toml . ../scripts
          python -m ruff format --config pyproject.toml --check . ../scripts
          mkdir -p ../.cache/pytest-ci
          python -m pytest --basetemp ../.cache/pytest-ci/tmp --tb=short --junitxml=../.cache/backend-results.xml
          python manage.py spectacular --validate --fail-on-warn --file ../.cache/schema.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: .cache/backend-results.xml
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.21.0
      - run: npm ci --prefix frontend
      - name: Frontend checks and one checked production build
        working-directory: frontend
        run: |
          mkdir -p ../.cache
          npm run test -- --reporter=default --reporter=json --outputFile=../.cache/unit-results.json
          npm run lint
          npm run format:check
          node ../scripts/check-reader-assertions.mjs
          node --test ../scripts/tests/browser-coverage.test.mjs
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: .cache/unit-results.json
  browser:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile, mobile-360, mobile-430]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: choralation_ci
          POSTGRES_USER: choralation
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U choralation -d choralation_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://choralation:ci-only-password@127.0.0.1:5432/choralation_ci
      TEST_DATABASE_NAME: test_choralation_ci
      DJANGO_MEDIA_ROOT: ${{ github.workspace }}/.cache/ci-media
      E2E_PROJECT: ${{ matrix.profile }}
      E2E_ENFORCE_COVERAGE: "true"
      E2E_PREBUILT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.21.0
      - run: npm ci --prefix frontend
      - run: python -m pip install -r backend/requirements/base.txt
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
      - name: Install browser
        run: |
          cd frontend
          npx playwright install --with-deps chromium
      - name: Both account modes in fresh disposable databases
        run: python scripts/system-browser.py --profiles ${{ matrix.profile }} --prebuilt
      - name: Upload mode-specific coverage, blobs and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports-${{ matrix.profile }}
          path: .cache/browser-reports
          retention-days: 7
      - name: Upload profile timings and server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs-${{ matrix.profile }}
          path: |
            .cache/system-tests/*/*.log
            .cache/system-tests/*/timings.json
          retention-days: 7
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: choralation_production_smoke
          POSTGRES_USER: choralation
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U choralation -d choralation_production_smoke"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
      - name: Build production image
        run: docker build --tag choralation:ci .
      - name: Install production probe dependencies
        run: python -m pip install -r backend/requirements/production.txt
      - name: Verify PDFs across fresh application containers
        run: python scripts/storage-container-check.py
  operations:
    # Infrastructure acceptance stays separate from the four browser profiles.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: choralation_operations_ci
          POSTGRES_USER: choralation
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U choralation -d choralation_operations_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://choralation:ci-only-password@127.0.0.1:5432/choralation_operations_ci
      TEST_DATABASE_NAME: test_choralation_operations_ci
      RUN_BACKUP_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/operations-tools
      - run: python -m pip install -r backend/requirements/dev.txt
      - name: Publishable-key REST snapshot, restored database, TLS S3 and matching app
        working-directory: backend
        run: |
          mkdir -p ../.cache
          python -m pytest tests/test_operations_integration.py -q --basetemp ../.cache/operations-test-tmp
  browser-report:
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.21.0
      - run: npm ci --prefix frontend
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-reports-*
          path: .cache/browser-reports
          merge-multiple: true
      - name: Check every profile/mode and merge browser reports
        working-directory: frontend
        run: node ../scripts/check-browser-reports.mjs
      - name: Merge available browser reports
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright merge-reports --config=tests/contracts/merge.config.ts ../.cache/browser-blobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-case-inventory
          path: .cache/browser-merged.json
          retention-days: 7
  checks:
    # Retain the existing required check name; no failed/skipped dependency can pass it.
    needs: [backend, frontend, browser, browser-report, production, operations]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check and every browser profile
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY
