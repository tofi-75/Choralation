name: Install Python operations dependencies
description: Pinned Python and dependencies without database/archive tools
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14.8'
        cache: pip
        cache-dependency-path: backend/requirements/base.txt
    - shell: bash
      run: python -m pip install -r backend/requirements/base.txt
